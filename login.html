<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード認証 | 私のプロンプト置き場</title>
  <link rel="stylesheet" href="zine-os.css">
</head>
<body>
  <div class="z-shell narrow" style="margin-top: 6vh;">

    <nav class="z-topbar" aria-label="Navigation">
      <a href="index.html" class="z-back">← INDEX / 置き場へ戻る</a>
      <div class="z-topmeta">
        <span>AUTH: <strong>LOCKED</strong></span>
      </div>
    </nav>

    <main class="z-win adult">
      <div class="z-win-bar">
        <div class="z-win-title">
          <span class="sq"></span>
          <span>ACCESS GATE // SECRET ARCHIVE</span>
        </div>
        <div class="z-win-controls">LOCK</div>
      </div>

      <div class="z-hero">
        <div class="z-kicker">PROTECTED PAGE</div>
        <h1 class="z-h1">秘密のページ</h1>
        <p class="z-lead">閲覧するにはパスワードを入力してください。</p>

        <div class="z-note-strip">
          <strong>ヒント：</strong>パイちゃんの名前を最初は大文字半角英字で
        </div>

        <form id="auth-form" class="z-form-row" onsubmit="checkPassword(event)">
          <input type="password" id="password-input" class="z-input" placeholder="Password..." autocomplete="off" autofocus>
          <button type="submit" class="z-submit">入室する</button>
        </form>
        <div id="error-msg" class="z-error-msg" aria-live="polite"></div>
      </div>
    </main>

    <footer class="z-footer">
      <span>PROMPT ARCHIVE // GATEKEEPER</span>
      <a href="index.html">CANCEL →</a>
    </footer>

  </div>

  <script>
    function checkPassword(e) {
      if (e) e.preventDefault();
      const correctPassword = "Pyrite";
      const errEl = document.getElementById("error-msg");
      const urlParams = new URLSearchParams(window.location.search);
      const secretPageUrl = urlParams.get("page");

      if (!secretPageUrl) {
        errEl.textContent = "エラー：行き先が指定されていません。";
        return;
      }

      const userInput = document.getElementById("password-input").value.trim();

      if (userInput === correctPassword) {
        errEl.textContent = "";
        window.location.href = secretPageUrl;
      } else {
        errEl.textContent = "パスワードが違います。";
        document.getElementById("password-input").select();
      }
    }
  </script>
</body>
</html>
